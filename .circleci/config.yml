# CircleCI configuration for the PDF Editor Nextcloud app.
#
# The GitHub Actions workflows remain the source of truth; this file runs the
# same commands through CircleCI so the "CircleCI Pipeline" commit status is
# meaningful instead of erroring on every push with
#
#     No configuration was found in your project.
#
# The jobs are split by toolchain so a failure names what broke: the PHP jobs
# share the `cimg/php` image, the frontend jobs share `cimg/node`.
#
# SPDX-FileCopyrightText: 2026 PDF Editor Contributors
# SPDX-License-Identifier: MIT

version: 2.1

# The app targets PHP ^8.4 (appinfo/info.xml), so the PHP jobs pin the 8.4 line
# rather than the moving `current` tag. The image ships Composer and the
# extensions the toolchain needs (intl, mbstring, zip, pdo_sqlite).
executors:
  php:
    docker:
      - image: cimg/php:8.6
    resource_class: medium
  node:
    docker:
      - image: cimg/node:26.13-browsers
    resource_class: medium

commands:
  install_php_dependencies:
    description: Install the Composer dependencies the PHP jobs share.
    steps:
      - run:
          name: Install Composer dependencies
          command: composer install --no-interaction --no-progress --ignore-platform-reqs

  install_node_dependencies:
    description: Install the pnpm version pinned in package.json and the dependencies the frontend jobs share.
    steps:
      - run:
          name: Install dependencies
          command: |
            # Node 26 ships node/npm/npx only: corepack is no longer in the
            # distribution, and the cimg images install Node from the official
            # tarball, so `corepack enable` fails there with "command not
            # found". Install the pnpm version pinned in package.json with npm
            # instead, which works on both the 24 and 26 lines.
            PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
            sudo npm install --global "pnpm@${PNPM_VERSION}"
            pnpm install --frozen-lockfile

jobs:
  php-unit:
    executor: php
    steps:
      - checkout
      - install_php_dependencies
      - run:
          name: PHPUnit
          command: composer run test:unit

  php-static-analysis:
    executor: php
    steps:
      - checkout
      - install_php_dependencies
      - run:
          name: PHPStan
          command: composer run phpstan
      - run:
          name: Psalm
          command: composer run psalm

  php-lint:
    executor: php
    steps:
      - checkout
      - install_php_dependencies
      - run:
          name: PHP syntax
          command: composer run lint
      - run:
          name: Coding standards
          command: composer run cs:check

  frontend:
    executor: node
    steps:
      - checkout
      - install_node_dependencies
      - run:
          name: Lint
          command: pnpm run lint
      - run:
          name: Stylelint
          command: pnpm run stylelint
      - run:
          name: Type check
          command: pnpm run check-types
      - run:
          name: Unit tests
          command: pnpm test
      - run:
          name: Script tests
          command: pnpm run test:scripts

  e2e:
    # The `-browsers` variant ships the shared libraries Chromium needs.
    executor: node
    steps:
      - checkout
      - install_node_dependencies
      - run:
          name: Build the frontend bundle
          command: pnpm run build
      - run:
          name: Install Playwright browsers
          command: pnpm exec playwright install --with-deps chromium
      - run:
          name: End-to-end tests
          command: pnpm run test:e2e

workflows:
  ci:
    jobs:
      - php-unit
      - php-static-analysis
      - php-lint
      - frontend
      - e2e
