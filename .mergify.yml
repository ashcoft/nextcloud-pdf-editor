merge_protections:
  - name: Enforce conventional commit
    description: Make sure that we follow https://www.conventionalcommits.org/en/v1.0.0/
    if:
      - base = main
      # The organization template workflows are rewritten from upstream by
      # sync-workflow-templates.yml, so the titles their pull requests carry
      # ("[main] Update nextcloud/ocp dependency", "Apply rector changes", ...)
      # cannot be fixed here. Their squashes are not meant to cut a release, so
      # leaving them out of this rule costs nothing.
      - "author != github-actions[bot]"
    success_conditions:
      # A type, an optional scope, an optional breaking-change marker, then a
      # colon, a space and a non-empty description.
      - "title ~= ^(fix|feat|docs|style|refactor|perf|test|build|ci|chore|revert)(\\(.+\\))?!?: \\S"
