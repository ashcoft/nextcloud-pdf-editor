# Opens a pull request when upstream PdfCraft cuts a release.
#
# The editor is a vendored build, so its version is a shell variable rather than
# a package dependency and no dependency updater sees it. This workflow is that
# updater: it runs scripts/bump-pdfcraft.sh, then opens a pull request when the
# pin actually changed.
#
# SPDX-FileCopyrightText: 2026 PDF Editor Contributors
# SPDX-License-Identifier: MIT

name: PdfCraft update

on:
  schedule:
    # Daily at 06:30 UTC, shortly after the Renovate run at 06:00.
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'PdfCraft version to pin (default: latest upstream release)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pdfcraft-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Bump the pin and re-vendor the bundle
        id: bump
        env:
          # Raises the API rate limit while resolving the release and its
          # checksum.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bound through the environment rather than interpolated into the
          # script, so a crafted value cannot inject commands.
          PDFCRAFT_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash scripts/bump-pdfcraft.sh "${PDFCRAFT_VERSION_INPUT}"
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          version="$(sed -n 's/^PDFCRAFT_VERSION="\([^"]*\)"/\1/p' scripts/fetch-pdfcraft.sh | head -1)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A pull request opened with the built-in token does not trigger this
          # repository's pull_request workflows, so its update would merge
          # untested. Set RENOVATE_TOKEN to have the checks run on their own;
          # the fallback keeps the scheduled run working when that secret is
          # unset, and a maintainer can approve the run.
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}
          commit-message: 'fix(deps): Update PdfCraft to ${{ steps.bump.outputs.version }}'
          committer: GitHub <noreply@github.com>
          author: nextcloud-command <nextcloud-command@users.noreply.github.com>
          signoff: true
          branch: automated/pdfcraft-update
          delete-branch: true
          title: 'Update PdfCraft to ${{ steps.bump.outputs.version }}'
          labels: |
            dependencies
          body: |
            Bumps the vendored PdfCraft editor to ${{ steps.bump.outputs.version }}.

            `scripts/bump-pdfcraft.sh` rewrote `PDFCRAFT_VERSION` and
            `PDFCRAFT_SHA256` together and re-ran `scripts/fetch-pdfcraft.sh`,
            so the committed bundle matches the new pin. The `pdfcraft-bundle`
            check re-fetches the release and fails if it does not.

            Before merging, confirm the `pdfcraft-bundle` and `e2e` checks pass.

            This pull request was created by an automated workflow on behalf of the repository maintainers.

